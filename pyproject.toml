[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "py_online_forecast"
dynamic = ["version"]
description = "A package for online forecasting and hierarchical reconciliation"
readme = "README.md"
requires-python = ">=3.12.3"
dependencies = [
  "numpy>=2.1,<3",
]

[project.optional-dependencies]
forecast_tools = [
  "pandas>=2.2,<3",
]
all = [
  "pandas>=2.2,<3",
]

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["py_online_forecast*"]

[tool.setuptools.package-data]
py_online_forecast = ["requirements.txt"]

[tool.setuptools.dynamic]
version = {attr = "py_online_forecast.__version__"}

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]
ignore = [
  "D203",
  "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]
"**/test_*.py" = ["D"]